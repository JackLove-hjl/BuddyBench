services:
  db:
    image: postgres:17-alpine
    container_name: llm-db
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
      POSTGRES_DB: llm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: llm-backend
    env_file: .env
    # 容器模式覆盖为主机名 db(本机模式 .env 用 localhost,两者互不影响)
    environment:
      DATABASE_URL: postgresql+asyncpg://llm:llm@db:5432/llm
      CHECKPOINT_DB_DSN: postgresql://llm:llm@db:5432/llm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - images_data:/app/static/images
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    container_name: llm-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
  images_data:
