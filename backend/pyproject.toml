[project]
name = "llm-chat-backend"
version = "0.1.0"
description = "DeepSeek 风格 AI 对话平台后端(FastAPI + langchain + deepagents + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.4",
    "langchain-core>=1.4",
    "langchain-openai>=1.4",
    "langgraph>=1.2",
    "deepagents==0.6.12",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg[binary]>=3.3",
    "matplotlib>=3.9",
    "psutil>=6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
llm-backend = "run:main"

[tool.uv]
# uv 管理的项目,本机虚拟环境存放在 .venv
